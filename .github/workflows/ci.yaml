name: ci

on: push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install NPM packages
        run: npm ci
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install NPM packages
        run: npm ci
      - name: Build
        run: npm run build

  generate-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.generate-tags.outputs.tags }}
    steps:
      - name: Generate tags
        uses: kgtkr/docker-tags-gen-action@master
        id: generate-tags
        with:
          name: ghcr.io/${{ github.repository_owner }}/kgtkr.net

  build-and-push:
    needs: [lint, build, generate-tags]
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build
        run: |
          nix run .#streamImage > image.tar
      - name: Push
        run: |
          skopeo login ghcr.io -u "$DOCKER_USER" -p "$DOCKER_PASS"
          for TAG in ${TAGS//,/ }; do
            skopeo copy docker-archive:./image.tar "docker://$TAG-${{ matrix.arch }}"
          done
        env:
          DOCKER_USER: ${{ github.repository_owner }}
          DOCKER_PASS: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ needs.generate-tags.outputs.tags }}

  push-manifest:
    needs: [generate-tags, build-and-push]
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          for TAG in ${TAGS//,/ }; do
            manifest-tool push from-args \
              --platforms linux/amd64,linux/arm64 \
              --template $TAG-ARCH \
              --target $TAG
          done
        env:
          TAGS: ${{ needs.generate-tags.outputs.tags }}
